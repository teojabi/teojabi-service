<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>터잡이 - 마이페이지</title>
    <!-- 검색엔진 크롤링 차단 -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <!-- 파비콘 설정 -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- 영문폰트 Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- 한글폰트 SUITE -->
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2/fonts/static/woff2/SUITE.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <style>
        .profile-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            color: white;
            padding: 4rem 20px;
            text-align: center;
        }

        .profile-header h2 {
            font-size: 2rem;
            margin-bottom: 0.4rem;
        }

        .profile-header p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 1.5rem;
        }

        .profile-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            align-items: center;
        }

        .dashboard-container {
            max-width: 1000px;
            margin: -3rem auto 3rem;
            background: var(--bg-main);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            padding: 1.5rem;
            text-align: center;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .tab:hover {
            background: var(--bg-muted);
        }

        .tab.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            background: transparent;
        }

        .tab-content {
            display: none;
            padding: 3rem 2rem;
            min-height: 400px;
        }

        .tab-content.active {
            display: block;
            animation: fadeInUp 0.3s ease-out forwards;
        }

        /* 찜한 매물 비포/애프터 이미지 컨테이너 */
        .card-image-container {
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .card-image-container img {
            transition: transform 0.3s ease;
        }

        .card-image-label {
            position: absolute;
            bottom: 8px;
            padding: 2px 6px;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 0.7rem;
            border-radius: 4px;
            font-weight: 500;
            z-index: 1;
        }

        .property-card:hover .card-image-container img {
            transform: scale(1.05);
        }

        /* 모달 공통 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--bg-main);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
        }

        .modal-box h3 {
            margin-bottom: 0.5rem;
            font-size: 1.3rem;
        }

        .modal-box p.modal-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .modal-field {
            margin-bottom: 1.2rem;
        }

        .modal-field label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        .modal-field input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            background: var(--bg-muted);
            color: var(--text-main);
            box-sizing: border-box;
        }

        .modal-field input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        .modal-error {
            color: var(--danger-color, #e53e3e);
            font-size: 0.88rem;
            margin-top: 0.3rem;
            display: none;
        }
    </style>
</head>

<body>
    <div id="header-container"></div>

    <section class="profile-header">
        <h2 id="profile-name">로딩 중...</h2>
        <p id="profile-email">-</p>
        <div id="profile-phone-container" style="margin-top: -1rem; margin-bottom: 1.5rem; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="ri-phone-line"></i>
            <span id="profile-phone">연락처 미등록</span>
            <span id="phone-status-badge" style="font-size: 0.75rem; padding: 2px 6px; border-radius: 12px; background: rgba(0,0,0,0.2); display: none;">인증완료</span>
        </div>
        <div class="profile-actions">
            <button class="btn btn-outline" style="border-color: rgba(255,255,255,0.4); color: white; display:inline-flex; align-items:center; justify-content:center;"
                onclick="window.logout()">로그아웃</button>
            <button class="btn btn-outline" style="font-size:1.2rem; border-color: rgba(255,255,255,0.4); color: white; display:inline-flex; align-items:center; justify-content:center;"
                onclick="openEditModal()" title="사용자 정보 수정">
                <i class="ri-pencil-line"></i>
            </button>
        </div>
    </section>

    <main class="container">
        <div class="dashboard-container">
            <div class="tabs">
                <div class="tab active" data-target="reservations">내 상담 예약</div>
                <div class="tab" data-target="likes">관심 매물</div>
                <div class="tab" data-target="paid-membership">유료회원</div>
            </div>

            <!-- 예약 내역 탭 -->
            <div class="tab-content active" id="tab-reservations">
                <h3 style="margin-bottom: 1.5rem;">나의 상담 예약 내역</h3>
                <div
                    style="text-align: center; padding: 4rem; color: var(--text-muted); border: 1px dashed var(--border-color); border-radius: var(--radius-md);">
                    <i class="ri-calendar-close-line" style="font-size: 3rem; margin-bottom: 1rem; display:block;"></i>
                    예약된 상담 내역이 없습니다.
                </div>
            </div>

            <!-- 관심 매물 탭 -->
            <div class="tab-content" id="tab-likes">
                <h3 style="margin-bottom: 1.5rem;">찜한 매물</h3>
                <div
                    style="text-align: center; padding: 4rem; color: var(--text-muted); border: 1px dashed var(--border-color); border-radius: var(--radius-md);">
                    <i class="ri-heart-3-line" style="font-size: 3rem; margin-bottom: 1rem; display:block;"></i>
                    관심 매물로 등록한 항목이 없습니다.
                </div>
            </div>

            <!-- 유료회원 탭 -->
            <div class="tab-content" id="tab-paid-membership">
                <h3 style="margin-bottom: 1.5rem;">유료회원 정보</h3>
                <div
                    style="text-align: center; padding: 4rem; color: var(--text-muted); border: 1px dashed var(--border-color); border-radius: var(--radius-md);">
                    <i class="ri-vip-crown-2-line" style="font-size: 3rem; margin-bottom: 1rem; display:block;"></i>
                    유료회원 정보를 불러오는 중입니다.
                </div>
            </div>
        </div>
    </main>

    <!-- 사용자 정보 수정 모달 -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-box">
            <h3>사용자 정보 수정</h3>
            <p class="modal-desc">닉네임과 연락처 정보를 수정할 수 있습니다.</p>
            <div class="modal-field">
                <label for="edit-name">닉네임</label>
                <input type="text" id="edit-name" placeholder="닉네임을 입력하세요">
            </div>
            <div class="modal-field">
                <label for="edit-email">연락처 이메일 <span style="color:var(--danger-color,#e53e3e)">*</span></label>
                <input type="email" id="edit-email" placeholder="이메일을 입력하세요">
                <div class="modal-error" id="edit-email-error">이메일은 필수 입력 항목입니다.</div>
            </div>
            <div class="modal-field">
                <label for="edit-phone">전화번호</label>
                <input type="tel" id="edit-phone" placeholder="010-0000-0000" maxlength="13">
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">상담 신청 시 연락 가능한 번호를 입력해주세요.</p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeEditModal()">취소</button>
                <button class="btn btn-primary" onclick="submitEditProfile()">저장</button>
            </div>
        </div>
    </div>

    <!-- 최초 로그인 사용자 정보 확인 모달 -->
    <div class="modal-overlay" id="welcome-modal">
        <div class="modal-box">
            <h3>👋 환영합니다!</h3>
            <p class="modal-desc">서비스 이용을 위해 상세 정보를 확인해 주세요.<br>이메일은 반드시 입력해야 합니다.</p>
            <div class="modal-field">
                <label for="welcome-name">닉네임</label>
                <input type="text" id="welcome-name" placeholder="닉네임을 입력하세요">
            </div>
            <div class="modal-field">
                <label for="welcome-email">연락처 이메일 <span style="color:var(--danger-color,#e53e3e)">*</span></label>
                <input type="email" id="welcome-email" placeholder="이메일을 입력하세요">
                <div class="modal-error" id="welcome-email-error">이메일은 필수 입력 항목입니다.</div>
            </div>
            <div class="modal-field">
                <label for="welcome-phone">전화번호</label>
                <input type="tel" id="welcome-phone" placeholder="010-0000-0000" maxlength="13">
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeWelcomeModal()">나중에</button>
                <button class="btn btn-primary" onclick="submitWelcomeProfile()">확인 및 저장</button>
            </div>
        </div>
    </div>

    <div id="login-modal-container"></div>
    <div id="footer-container"></div>
    <script src="/js/config.js"></script>
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/mypage.js"></script>
</body>

</html>
