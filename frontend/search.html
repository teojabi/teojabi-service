<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지도 검색 | 터잡이</title>
    <meta name="description" content="터잡이 지도 검색 - 네이버 지도로 부동산 매물과 토지 정보를 한눈에 확인하세요.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body class="map-page">

    <!-- 공통 헤더 -->
    <div id="header-container"></div>

    <!-- ─────────────────────────────────────────────
         지도 메인 영역
    ────────────────────────────────────────────── -->
    <div id="map-container">

        <!-- 검색바 오버레이 -->
        <div class="search-bar-wrapper">
            <div class="search-input-row">
                <span class="search-input-icon"><i class="ri-search-line"></i></span>
                <input
                    type="text"
                    id="search-input"
                    placeholder="주소 또는 지역명을 입력하세요"
                    autocomplete="off"
                    aria-label="지도 검색"
                >
                <button id="btn-search-clear" class="btn-search-clear" aria-label="검색어 지우기" title="지우기">
                    <i class="ri-close-line"></i>
                </button>
                <button id="btn-search-submit" aria-label="검색">
                    <i class="ri-search-line"></i>
                </button>
            </div>
            <!-- 자동완성 드롭다운 -->
            <div id="search-autocomplete" role="listbox" aria-label="검색 자동완성"></div>
        </div>

        <!-- 지도 컨트롤 버튼 (우측 하단) -->
        <div class="map-controls">
            <button
                id="btn-cadastral"
                class="map-ctrl-btn"
                onclick="toggleCadastral()"
                aria-label="지적도 레이어 ON/OFF"
                title="지적도 표시"
            >
                <i class="ri-layout-grid-line"></i>
                <span>지적도</span>
            </button>
            <button
                class="map-ctrl-btn"
                onclick="navigator.geolocation && navigator.geolocation.getCurrentPosition(pos => {
                    const latlng = new naver.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                    map.panTo(latlng); map.setZoom(17);
                })"
                aria-label="현재 위치로 이동"
                title="현재 위치"
            >
                <i class="ri-focus-3-line"></i>
                <span>현위치</span>
            </button>
        </div>

    </div>
    <!-- /map-container -->

    <!-- ─────────────────────────────────────────────
         좌측 슬라이딩 패널
    ────────────────────────────────────────────── -->
    <aside id="map-panel" role="complementary" aria-label="상세 정보 패널">
        <div class="panel-header">
            <div class="panel-title">
                <i class="ri-map-pin-2-line"></i>
                <span>정보</span>
            </div>
            <button
                class="panel-close-btn"
                onclick="closePanel()"
                aria-label="패널 닫기"
                title="닫기"
            >
                <i class="ri-close-line"></i>
            </button>
        </div>

        <!-- 패널 본문 (JS로 동적 렌더링) -->
        <div class="panel-body">
            <p style="color:var(--text-muted);font-size:0.88rem;text-align:center;margin-top:40px;">
                지도를 클릭하거나 매물 마커를 선택하면<br>상세 정보가 여기에 표시됩니다.
            </p>
        </div>

        <!-- 예약 버튼 (매물 타입일 때만 표시) -->
        <div id="panel-cta" class="panel-cta hidden">
            <button
                class="btn-reserve"
                onclick="alert('상담 예약 기능은 준비 중입니다.')"
            >
                <i class="ri-calendar-check-line"></i>
                상담 예약하기
            </button>
        </div>
    </aside>

    <!-- 로그인 모달 -->
    <div id="login-modal-container"></div>

    <!-- ─────────────────────────────────────────────
         스크립트 로딩 순서 (중요):
         1. search.js  → window.initMap 전역 등록
         2. config.js  → CONFIG.NAVER_MAP_CLIENT_ID 로드
         3. SDK 주입   → async 로드 후 callback=initMap 호출
         4. 공통 컴포넌트 (module) → 헤더·모달·인증 초기화
    ────────────────────────────────────────────── -->

    <!-- 1. 지도 로직: window.initMap이 SDK 콜백보다 먼저 반드시 정의되어야 함 -->
    <script src="/js/pages/search.js"></script>

    <!-- 2 + 3. config.js 로드 후 즉시 SDK 주입 -->
    <script src="/js/config.js"></script>
    <script>
        (function () {
            const clientId = (typeof CONFIG !== 'undefined' && CONFIG.NAVER_MAP_CLIENT_ID)
                ? CONFIG.NAVER_MAP_CLIENT_ID
                : '';
            if (!clientId) {
                console.error('[터잡이] NAVER_MAP_CLIENT_ID가 config.js에 설정되지 않았습니다.');
                return;
            }
            const script = document.createElement('script');
            // geocoder: 주소 검색 / reverseGeocode, cadastral: 지적도 레이어
            script.src = `https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=${clientId}&submodules=geocoder,cadastral&callback=initMap`;
            script.async = true;
            document.head.appendChild(script);
        })();
    </script>

    <!-- 4. 공통 컴포넌트 (헤더·모달·인증) — module 방식 -->
    <script type="module">
        import { renderHeader } from '/js/components/header.js';
        import { renderLoginModal } from '/js/components/login-modal.js';
        import { checkAuthStatus } from '/js/auth.js';

        renderHeader('header-container');
        renderLoginModal('login-modal-container');
        await checkAuthStatus();

        window.openLoginModal = () => {
            const modal = document.querySelector('.modal-overlay');
            if (modal) modal.classList.add('active');
        };
        window.closeLoginModal = () => {
            const modal = document.querySelector('.modal-overlay');
            if (modal) modal.classList.remove('active');
        };
    </script>

</body>
</html>
