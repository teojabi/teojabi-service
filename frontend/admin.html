<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>터잡이 - 일반 관리자 페이지</title>
    <!-- 검색엔진 크롤링 차단 -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <!-- 파비콘 설정 -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- 영문폰트 Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- 한글폰트 SUITE -->
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2/fonts/static/woff2/SUITE.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <style>
        .admin-layout {
            display: flex;
            min-height: calc(100vh - var(--header-height));
            background: var(--bg-muted);
        }

        .admin-sidebar {
            width: 250px;
            background: var(--bg-main);
            border-right: 1px solid var(--border-color);
            padding: 2rem 0;
        }

        .admin-nav .nav-item {
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .admin-nav .nav-item:hover,
        .admin-nav .nav-item.active {
            color: var(--primary-color);
            background: rgba(37, 99, 235, 0.05);
            border-right: 3px solid var(--primary-color);
        }

        .admin-content {
            flex-grow: 1;
            padding: 3rem;
            max-width: 1000px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .panel {
            background: var(--bg-main);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        /* 매물 관리 카드 - PC 기본 (가로형 리스트) */
        .property-card-admin {
            display: flex;
            gap: 20px;
            padding: 1.2rem 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            align-items: center;
            background: #fff;
        }

        .prop-admin-images {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .prop-admin-img-wrap {
            position: relative;
            width: 100px;
            height: 80px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-muted);
        }

        .prop-admin-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .prop-admin-img-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--border-color);
            font-size: 1.5rem;
        }

        .prop-admin-img-label {
            position: absolute;
            bottom: 3px;
            left: 4px;
            font-size: 0.65rem;
            background: rgba(0,0,0,0.5);
            color: #fff;
            padding: 1px 4px;
            border-radius: 3px;
        }

        .prop-admin-info {
            flex-grow: 1;
        }

        .prop-admin-info h3 {
            margin-bottom: 0.3rem;
            font-size: 1.05rem;
        }

        .prop-admin-address {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin-bottom: 0.2rem;
        }

        .prop-admin-price {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.2rem;
        }

        .prop-admin-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .prop-admin-bottom {
            display: contents;
        }

        .prop-admin-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            align-items: flex-end;
        }

        .prop-admin-delete-btn {
            background-color: var(--error-color);
            color: white;
            border: none;
        }

        .prop-manage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 0.5rem;
        }

        .prop-manage-title {
            white-space: nowrap;
            flex-shrink: 0;
        }

        .prop-manage-actions {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        /* 모바일: 갤러리 카드형 */
        @media (max-width: 768px) {
            .admin-sidebar {
                display: none;
            }

            .admin-content {
                padding: 1.5rem;
            }

            .btn-label {
                display: none;
            }

            #property-list-container {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                padding: 0 0.5rem;
            }

            .property-card-admin {
                flex-direction: column;
                padding: 0;
                gap: 0;
                overflow: hidden;
                aspect-ratio: 1 / 1;
                width: 100%;
            }

            .prop-admin-images {
                width: 100%;
                gap: 2px;
                flex: 1;
            }

            .prop-admin-img-wrap {
                width: 50%;
                border-radius: 0;
                height: auto;
                aspect-ratio: 1 / 1;
            }

            .prop-admin-bottom {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0.6rem 0.8rem;
                gap: 0.5rem;
                width: 100%;
                box-sizing: border-box;
            }

            .prop-admin-info {
                padding: 0;
                flex: 1;
                text-align: left;
            }

            .prop-admin-info h3 {
                font-size: 0.9rem;
            }

            .prop-admin-date {
                display: none;
            }

            .prop-admin-actions {
                flex-direction: column;
                justify-content: center;
                padding: 0;
                gap: 4px;
                flex-shrink: 0;
            }
        }
    </style>
</head>

<body>
    <div id="header-container"></div>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="admin-nav">
                <div class="nav-item active" data-target="prop-manage">
                    <i class="ri-list-settings-line"></i> 매물 관리
                </div>
                <div class="nav-item" data-target="reserv-manage">
                    <i class="ri-calendar-check-line"></i> 예약 관리
                </div>
                <div class="nav-item" data-target="settings-manage">
                    <i class="ri-settings-4-line"></i> 서비스 설정
                </div>
            </nav>
        </aside>

        <main class="admin-content">
            <!-- 매물 등록 탭 -->
            <div id="prop-register" class="panel hidden">
                <h2 style="margin-bottom: 2rem;"><i class="ri-edit-box-line"></i> 신규 컨설팅 매물 등록</h2>

                <form id="property-form">
                    <div class="form-group">
                        <label>매물 / 컨설팅 제목</label>
                        <input type="text" class="form-control" name="title" placeholder="예: 강남역 도보 5분 꼬마빌딩 부지"
                            required>
                    </div>

                    <div class="form-group">
                        <label>지번 주소 (필수 식별 및 지도 핀)</label>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="admin-address-input" class="form-control" name="address" placeholder="지번 주소를 정확히 입력해주세요" required>
                            <button type="button" class="btn btn-outline" id="btn-geocode-address" style="white-space:nowrap;">주소 확인</button>
                        </div>
                        <div id="geocode-result" style="margin-top:8px; font-size:0.9rem; color:var(--primary-color);"></div>
                        <input type="hidden" name="lat" id="admin-lat">
                        <input type="hidden" name="lng" id="admin-lng">
                        <input type="hidden" name="pnu" id="admin-pnu">
                    </div>

                    <div class="form-group">
                        <label>컨설팅 상세 의견 및 분석</label>
                        <textarea class="form-control" name="description" placeholder="매물에 대한 코멘트를 작성합니다."
                            required></textarea>
                    </div>

                    <div class="form-group">
                        <label>매가 / 호가</label>
                        <div style="display:flex; align-items:center; gap: 10px;">
                            <input type="number" class="form-control" name="price" style="width: 200px;"
                                placeholder="숫자로 입력">
                            <span style="color:var(--text-muted)">원</span>
                            <span id="price-kr" style="color:var(--primary-color); font-weight:500;"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>갤러리 이미지 업로드 (Before & After)</label>
                        <div style="display: flex; gap: 1rem;">
                            <div style="flex: 1;">
                                <label style="font-weight: normal; font-size: 0.9em; margin-bottom: 0.3rem;">Before 이미지</label>
                                <input type="file" id="image-upload-before" class="form-control" accept="image/*">
                                <div id="preview-before" style="margin-top: 0.5rem; display: none;">
                                    <p style="font-size: 0.85em; color: var(--text-muted); margin-bottom: 0.3rem;">현재 등록된 이미지:</p>
                                    <img id="preview-before-img" src="" alt="Before 이미지 미리보기" style="max-width: 100%; max-height: 200px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); object-fit: cover;">
                                </div>
                            </div>
                            <div style="flex: 1;">
                                <label style="font-weight: normal; font-size: 0.9em; margin-bottom: 0.3rem;">After 이미지</label>
                                <input type="file" id="image-upload-after" class="form-control" accept="image/*">
                                <div id="preview-after" style="margin-top: 0.5rem; display: none;">
                                    <p style="font-size: 0.85em; color: var(--text-muted); margin-bottom: 0.3rem;">현재 등록된 이미지:</p>
                                    <img id="preview-after-img" src="" alt="After 이미지 미리보기" style="max-width: 100%; max-height: 200px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); object-fit: cover;">
                                </div>
                            </div>
                        </div>
                        <small style="color: var(--text-muted); display:block; margin-top:5px;">Before와 After 이미지를 각각 따로 등록해주세요.</small>
                    </div>

                    <div style="text-align: right; margin-top: 3rem;">
                        <button type="submit" class="btn btn-primary btn-lg"><i class="ri-save-3-line"></i> 매물 저장하고
                            게시하기</button>
                    </div>
                </form>
            </div>

            <!-- 등록 매물 관리 탭 -->
            <div id="prop-manage" class="panel">
                <div class="prop-manage-header">
                    <h2 class="prop-manage-title"><i class="ri-list-settings-line"></i> 매물 관리</h2>
                    <div class="prop-manage-actions">
                        <button class="btn btn-primary btn-sm" id="btn-go-prop-register">
                            <i class="ri-add-box-line"></i><span class="btn-label"> 매물 등록</span>
                        </button>
                        <button class="btn btn-outline btn-sm" id="btn-refresh-properties">
                            <i class="ri-refresh-line"></i><span class="btn-label"> 새로고침</span>
                        </button>
                    </div>
                </div>
                
                <div id="property-list-container">
                    <div style="text-align: center; padding: 3rem; color: var(--text-muted);">
                        <i class="ri-loader-4-line ri-spin" style="font-size: 2rem; margin-bottom: 1rem; display: block;"></i>
                        매물 목록을 불러오는 중입니다...
                    </div>
                </div>
            </div>
            <div id="reserv-manage" class="panel hidden">
                <h2>전체 예약 관리</h2>
                <p>사용자들의 예약 신청 내역 관리</p>
            </div>

            <!-- 서비스 설정 탭 -->
            <div id="settings-manage" class="panel hidden">
                <h2 style="margin-bottom: 2rem;"><i class="ri-settings-4-line"></i> 서비스 설정 관리</h2>
                
                <div class="form-group">
                    <label>샘플 보고서 URL</label>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="setting-sample-report-url" class="form-control" placeholder="https://..." value="">
                        <button type="button" class="btn btn-primary" id="btn-save-sample-report-url" style="white-space:nowrap;">저장</button>
                    </div>
                    <small style="color: var(--text-muted); display:block; margin-top:5px;">지도 검색 페이지의 '리포트 예시' 버튼 클릭 시 열리는 주소입니다.</small>
                </div>
            </div>

        </main>
    </div>

    <!-- 숨겨진 지도 컨테이너: NCP 인증 세션 초기화를 위해 필요 -->
    <div id="hidden-map-container" style="width:1px;height:1px;position:absolute;top:-9999px;"></div>

    <script src="/js/config.js"></script>
    <script>
        window.initAdminMap = function () {
            // NCP 인증 세션 수립을 위해 숨겨진 지도 객체를 초기화
            if (typeof naver !== 'undefined' && naver.maps) {
                new naver.maps.Map('hidden-map-container', {
                    center: new naver.maps.LatLng(37.5665, 126.9780),
                    zoom: 10
                });
            }
        };
    </script>
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=f8td9fq8kq&callback=initAdminMap"></script>
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps-geocoder.js"></script>
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/admin.js"></script>
</body>

</html>
