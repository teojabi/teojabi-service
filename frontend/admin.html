<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>터잡이 - 일반 관리자 페이지</title>
    <!-- 파비콘 설정 -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- 영문폰트 Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- 한글폰트 SUITE -->
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2/fonts/static/woff2/SUITE.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <style>
        .admin-layout {
            display: flex;
            min-height: calc(100vh - var(--header-height));
            background: var(--bg-muted);
        }

        .admin-sidebar {
            width: 250px;
            background: var(--bg-main);
            border-right: 1px solid var(--border-color);
            padding: 2rem 0;
        }

        .admin-nav .nav-item {
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .admin-nav .nav-item:hover,
        .admin-nav .nav-item.active {
            color: var(--primary-color);
            background: rgba(37, 99, 235, 0.05);
            border-right: 3px solid var(--primary-color);
        }

        .admin-content {
            flex-grow: 1;
            padding: 3rem;
            max-width: 1000px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .panel {
            background: var(--bg-main);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <div id="header-container"></div>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="admin-nav">
                <div class="nav-item active" data-target="prop-register">
                    <i class="ri-add-box-line"></i> 매물 등록
                </div>
                <div class="nav-item" data-target="prop-manage">
                    <i class="ri-list-settings-line"></i> 등록 매물 관리
                </div>
                <div class="nav-item" data-target="reserv-manage">
                    <i class="ri-calendar-check-line"></i> 예약 내역 전체보기
                </div>
            </nav>
        </aside>

        <main class="admin-content">
            <!-- 매물 등록 탭 -->
            <div id="prop-register" class="panel">
                <h2 style="margin-bottom: 2rem;"><i class="ri-edit-box-line"></i> 신규 컨설팅 매물 등록</h2>

                <form id="property-form">
                    <div class="form-group">
                        <label>매물 / 컨설팅 제목</label>
                        <input type="text" class="form-control" name="title" placeholder="예: 강남역 도보 5분 꼬마빌딩 부지"
                            required>
                    </div>

                    <div class="form-group">
                        <label>지번 주소 (필수 식별 및 지도 핀)</label>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="admin-address-input" class="form-control" name="address" placeholder="지번 주소를 정확히 입력해주세요" required>
                            <button type="button" class="btn btn-outline" id="btn-geocode-address" style="white-space:nowrap;">주소 확인</button>
                        </div>
                        <div id="geocode-result" style="margin-top:8px; font-size:0.9rem; color:var(--primary-color);"></div>
                        <input type="hidden" name="lat" id="admin-lat">
                        <input type="hidden" name="lng" id="admin-lng">
                        <input type="hidden" name="pnu" id="admin-pnu">
                    </div>

                    <div class="form-group">
                        <label>컨설팅 상세 의견 및 분석</label>
                        <textarea class="form-control" name="description" placeholder="매물에 대한 코멘트를 작성합니다."
                            required></textarea>
                    </div>

                    <div class="form-group">
                        <label>매가 / 호가</label>
                        <div style="display:flex; align-items:center; gap: 10px;">
                            <input type="number" class="form-control" name="price" style="width: 200px;"
                                placeholder="숫자로 입력">
                            <span style="color:var(--text-muted)">원</span>
                            <span id="price-kr" style="color:var(--primary-color); font-weight:500;"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>갤러리 이미지 업로드 (Before & After)</label>
                        <div style="display: flex; gap: 1rem;">
                            <div style="flex: 1;">
                                <label style="font-weight: normal; font-size: 0.9em; margin-bottom: 0.3rem;">Before 이미지</label>
                                <input type="file" id="image-upload-before" class="form-control" accept="image/*">
                            </div>
                            <div style="flex: 1;">
                                <label style="font-weight: normal; font-size: 0.9em; margin-bottom: 0.3rem;">After 이미지</label>
                                <input type="file" id="image-upload-after" class="form-control" accept="image/*">
                            </div>
                        </div>
                        <small style="color: var(--text-muted); display:block; margin-top:5px;">Before와 After 이미지를 각각 따로 등록해주세요.</small>
                    </div>

                    <div style="text-align: right; margin-top: 3rem;">
                        <button type="submit" class="btn btn-primary btn-lg"><i class="ri-save-3-line"></i> 매물 저장하고
                            게시하기</button>
                    </div>
                </form>
            </div>

            <!-- 등록 매물 관리 탭 -->
            <div id="prop-manage" class="panel hidden">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h2><i class="ri-list-settings-line"></i> 등록 매물 관리</h2>
                    <button class="btn btn-outline" id="btn-refresh-properties">
                        <i class="ri-refresh-line"></i> 새로고침
                    </button>
                </div>
                
                <div id="property-list-container">
                    <div style="text-align: center; padding: 3rem; color: var(--text-muted);">
                        <i class="ri-loader-4-line ri-spin" style="font-size: 2rem; margin-bottom: 1rem; display: block;"></i>
                        매물 목록을 불러오는 중입니다...
                    </div>
                </div>
            </div>
            <div id="reserv-manage" class="panel hidden">
                <h2>전체 예약 관리</h2>
                <p>사용자들의 예약 신청 내역 관리</p>
            </div>

        </main>
    </div>

    <!-- 숨겨진 지도 컨테이너: NCP 인증 세션 초기화를 위해 필요 -->
    <div id="hidden-map-container" style="width:1px;height:1px;position:absolute;top:-9999px;"></div>

    <script src="/js/config.js"></script>
    <script>
        window.initAdminMap = function () {
            // NCP 인증 세션 수립을 위해 숨겨진 지도 객체를 초기화
            if (typeof naver !== 'undefined' && naver.maps) {
                new naver.maps.Map('hidden-map-container', {
                    center: new naver.maps.LatLng(37.5665, 126.9780),
                    zoom: 10
                });
            }
        };
    </script>
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=f8td9fq8kq&callback=initAdminMap"></script>
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps-geocoder.js"></script>
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/admin.js"></script>
</body>

</html>
