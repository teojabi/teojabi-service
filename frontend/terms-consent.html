<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>터잡이 - 약관 동의</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2/fonts/static/woff2/SUITE.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <style>
        body {
            min-height: 100vh;
            background: var(--bg-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .consent-card {
            width: 100%;
            max-width: 460px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 1.25rem;
        }

        .consent-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }

        .consent-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .consent-section-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .consent-option {
            margin-bottom: 0.9rem;
        }

        .consent-option-label {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.45;
        }

        .consent-option-label input {
            margin-top: 0.2rem;
            width: 1rem;
            height: 1rem;
            accent-color: var(--primary-color);
            flex-shrink: 0;
        }

        .consent-links {
            margin-left: 1.5rem;
            margin-top: 0.35rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .consent-links a {
            font-size: 0.88rem;
            color: var(--primary-color);
            text-decoration: underline;
        }

        .consent-action {
            margin-top: 1.1rem;
            width: 100%;
            border: none;
        }

        .consent-action:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .consent-error {
            margin-top: 0.7rem;
            color: #ef4444;
            font-size: 0.88rem;
            display: none;
        }

        @media (max-width: 480px) {
            .consent-card {
                border-radius: var(--radius-md);
                padding: 1rem;
            }

            .consent-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>
    <main class="consent-card" role="main">
        <h1 class="consent-title">약관 동의 (필수)</h1>
        <p class="consent-desc">서비스 이용을 위해 아래 약관에 동의해 주세요.</p>

        <p class="consent-section-title">약관 동의 (필수)</p>

        <div class="consent-option">
            <label class="consent-option-label" for="agreeAll">
                <input type="checkbox" id="agreeAll">
                <span>이용약관 및 개인정보처리방침에 모두 동의합니다. (필수)</span>
            </label>
            <div class="consent-links">
                <a href="https://docs.google.com/document/d/1Rx1uMSTTAWdZ80M3A3zL5jj8nIb1sZbZhxbLznrKlCU/edit?tab=t.0" target="_blank" rel="noopener noreferrer">이용약관 보기</a>
                <a href="https://docs.google.com/document/d/1Rx1uMSTTAWdZ80M3A3zL5jj8nIb1sZbZhxbLznrKlCU/edit?tab=t.0" target="_blank" rel="noopener noreferrer">개인정보처리방침 보기</a>
            </div>
        </div>

        <div class="consent-option">
            <label class="consent-option-label" for="agreeCollect">
                <input type="checkbox" id="agreeCollect">
                <span>개인정보 수집 및 이용에 동의합니다. (필수)</span>
            </label>
            <div class="consent-links">
                <a href="https://docs.google.com/document/d/1Rx1uMSTTAWdZ80M3A3zL5jj8nIb1sZbZhxbLznrKlCU/edit?tab=t.0" target="_blank" rel="noopener noreferrer">상세 보기</a>
            </div>
        </div>

        <button id="consentProceedBtn" class="btn btn-primary consent-action" disabled>
            전체 동의하고 소셜 로그인 진행하기
        </button>
        <p id="consentError" class="consent-error">필수 약관에 모두 동의해 주세요.</p>
    </main>

    <script src="/config.js"></script>
    <script type="module" src="/js/pages/terms-consent.js"></script>
</body>

</html>
