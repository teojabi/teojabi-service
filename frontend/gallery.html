<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>터잡이 - 매물 컨설팅 갤러리</title>
    <!-- 파비콘 설정 -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- 영문폰트 Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- 한글폰트 SUITE -->
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2/fonts/static/woff2/SUITE.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <style>
        .page-header {
            padding: 4rem 20px 2rem;
            text-align: center;
            background: var(--bg-muted);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 3rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .property-card {
            background: var(--bg-main);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .property-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-title {
            font-size: 1.15rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .card-address {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
        }
    </style>
</head>

<body>
    <div id="header-container"></div>

    <header class="page-header">
        <div class="container">
            <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">프리미엄 컨설팅 매물</h1>
            <p style="color: var(--text-muted); font-size: 1.1rem;">터잡이 전문가들이 직접 발굴하고 분석한 알짜 부동산 매물들을 소개합니다.</p>
        </div>
    </header>

    <main class="container">
        <div class="gallery-grid" id="gallery-container">
            <!-- JS 동적 생성 영역. 임시 로딩 플레이스홀더 -->
            <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">
                <i class="ri-loader-4-line"
                    style="font-size: 2rem; display: inline-block; animation: spin 1s linear infinite;"></i>
                <p style="margin-top: 1rem;">매물 정보를 불러오는 중입니다...</p>
            </div>
        </div>

        <!-- 페이지네이션 UI는 필요시 추가 -->
    </main>

    <div id="login-modal-container"></div>
    <script src="/js/config.js"></script>
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/gallery.js"></script>
</body>

</html>
