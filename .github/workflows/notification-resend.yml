name: Resend Notification Digest

on:
  workflow_dispatch:
    inputs:
      userIds:
        description: 'Comma-separated user ids to resend to'
        required: true
      dryRun:
        description: 'true = preview only, false = actually send'
        required: false
        default: 'true'
  push:
    branches: [main]
    paths: ['.github/workflows/notification-resend.yml']

permissions:
  contents: read

env:
  RESEND_USER_IDS: '013b1634-88d1-4638-96ed-da2d947c92a8,1bda055d-b958-46b0-94ce-e695900358b1,23c17efe-8c07-4ac2-9fa2-5c057759c9bc,30eae37b-af84-44e0-9112-0d6d6314f6a9,4bccd275-f49b-4103-bb1a-7e11623ba7f9,5cb3e37f-09c1-4d2d-bf34-7f68c015992f,5de2321b-6b4a-4b14-993d-71ad375e12eb,6face2f1-1526-40ed-bea3-d96dac803171,8341ecc8-d509-4abb-80e4-3711b7532421,d147532f-48eb-4b07-a3c0-9cd81259ffb4,d3fd48a3-5256-49eb-9e4b-591d36f3e274'
  RESEND_DRY_RUN: 'true'

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Resend digest on NCP
        uses: appleboy/ssh-action@v1.1.0
        env:
          RESEND_USER_IDS: ${{ github.event.inputs.userIds || env.RESEND_USER_IDS }}
          RESEND_DRY_RUN: ${{ github.event.inputs.dryRun || env.RESEND_DRY_RUN }}
        with:
          host: ${{ secrets.NCP_SSH_HOST }}
          username: ${{ secrets.NCP_SSH_USER }}
          password: ${{ secrets.NCP_SSH_PASSWORD }}
          command_timeout: 10m
          envs: RESEND_USER_IDS,RESEND_DRY_RUN
          script: |
            cd ~/teojabi-service/backend
            set -a
            . ./.env
            set +a
            OUT=/tmp/resend-run.log
            {
              echo '--- whoami/pwd ---'; whoami; pwd
              echo '--- ls dist/src/scripts ---'; ls -la dist/src/scripts 2>&1
              echo '--- ls dist/scripts ---'; ls -la dist/scripts 2>&1
              echo '--- node ---'; node --version 2>&1
              echo '--- run ---'
              node dist/src/scripts/resend-digest.js --userIds="$RESEND_USER_IDS" --dryRun="$RESEND_DRY_RUN" 2>&1
              echo "exit=$?"
            } > "$OUT" 2>&1 || true
            node -e "const{PrismaClient}=require('@prisma/client');const fs=require('fs');const p=new PrismaClient();let txt='';try{txt=fs.readFileSync('/tmp/resend-run.log','utf8').slice(0,9000);}catch(e){txt='no-log '+String(e);}p.\$executeRawUnsafe('INSERT INTO public.ops_resend_log(payload) VALUES (\$1::jsonb)',JSON.stringify({run:txt})).then(()=>p.\$disconnect()).then(()=>process.exit(0)).catch(e=>{console.error(String(e));process.exit(0);});"
