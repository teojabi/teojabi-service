name: Resend Notification Digest

on:
  workflow_dispatch:
    inputs:
      userIds:
        description: 'Comma-separated user ids to resend to'
        required: true
      dryRun:
        description: 'true = preview only, false = actually send'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Resend digest on NCP
        uses: appleboy/ssh-action@v1.1.0
        env:
          RESEND_USER_IDS: ${{ inputs.userIds }}
          RESEND_DRY_RUN: ${{ inputs.dryRun }}
        with:
          host: ${{ secrets.NCP_SSH_HOST }}
          username: ${{ secrets.NCP_SSH_USER }}
          password: ${{ secrets.NCP_SSH_PASSWORD }}
          command_timeout: 10m
          envs: RESEND_USER_IDS,RESEND_DRY_RUN
          script: |
            set -e
            cd ~/teojabi-service/backend
            set -a
            . ./.env
            set +a
            node dist/src/scripts/resend-digest.js --userIds="$RESEND_USER_IDS" --dryRun="$RESEND_DRY_RUN"
