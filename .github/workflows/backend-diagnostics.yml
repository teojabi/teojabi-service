name: Inspect Backend Deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/backend-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect installation without changing the running service
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.NCP_SSH_HOST }}
          username: ${{ secrets.NCP_SSH_USER }}
          password: ${{ secrets.NCP_SSH_PASSWORD }}
          command_timeout: 2m
          script: |
            set -e
            cd ~/teojabi-service/backend
            echo 'MEMORY'
            free -m
            echo 'DISK'
            df -h .
            echo 'BETA RUNTIME PREREQUISITES'
            command -v python3 || true
            python3 --version || true
            python3 -c 'import psycopg2; print("psycopg2", psycopg2.__version__)' || true
            if sudo -n true 2>/dev/null; then echo 'PASSWORDLESS_SUDO yes'; else echo 'PASSWORDLESS_SUDO no'; fi
            echo 'LISTENING TCP PORTS'
            ss -ltn | head -30 || true
            echo 'NGINX ROUTES (VALUES REDACTED TO ROUTING DIRECTIVES)'
            sudo -n nginx -T 2>/dev/null | grep -E '^[[:space:]]*(listen|server_name|location|proxy_pass)' | head -80 || true
            echo 'NODE PROCESSES (NO ARGUMENTS OR ENVIRONMENT)'
            ps -eo pid,etime,pcpu,pmem,comm | awk '$5 ~ /node|npm/ { print }'
            echo 'NPM LOG SIZES AND RECENT ERROR CODES'
            latest_log=$(find ~/.npm/_logs -maxdepth 1 -name '*debug*.log' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
            if [ -n "$latest_log" ]; then
              stat -c 'Log bytes: %s; modified: %y' "$latest_log"
              grep -E 'error code |error errno |error syscall |verbose exit |verbose code ' "$latest_log" | tail -10 || true
            fi
            echo 'BETA SUPABASE READ CHECK'
            cd ~/teojabi-runtime/beta-service
            set -a
            . ./.env
            set +a
            .venv/bin/python -X utf8 - <<'PYEOF' || true
            import importlib.util
            spec=importlib.util.spec_from_file_location('reader','local-reader.py')
            reader=importlib.util.module_from_spec(spec);spec.loader.exec_module(reader)
            try:
                print(reader.read('selected-context','{"sourceId":"2643920724","pnu":"1132010500104140131","address":"서울특별시 도봉구 쌍문동 414-131"}'))
            except Exception as error:
                diag=getattr(error,'diag',None)
                print({'type':type(error).__name__,'pgcode':getattr(error,'pgcode',None),'message':getattr(diag,'message_primary',None),'table':getattr(diag,'table_name',None),'column':getattr(diag,'column_name',None)})
            PYEOF
