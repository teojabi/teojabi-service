name: Supabase Token Check

# Supabase Access Token 의 만료/유효성을 주 1회 점검한다.
# - Management API 호출로 유효성 확인
# - 만료 임박(14일 이내) 또는 무효면 경고 + 이슈 생성
# 만료일 자동 감지: 토큰이 JWT면 exp 사용, 아니면 시크릿 SUPABASE_TOKEN_EXPIRES_AT(YYYY-MM-DD) 사용.
on:
  schedule:
    - cron: '0 1 * * 1'   # 매주 월요일 01:00 UTC (KST 10:00)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      EXPIRES_AT: ${{ secrets.SUPABASE_TOKEN_EXPIRES_AT }}
    steps:
      - name: Check token validity and expiry
        id: check
        run: |
          set +e
          warn=0
          if [ -z "$TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN 시크릿이 없습니다."
            echo "alert=1" >> "$GITHUB_OUTPUT"
            echo "reason=토큰 시크릿 없음" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.supabase.com/v1/projects || echo 000)
          echo "Management API 응답: $code"
          reason=""
          if [ "$code" != "200" ]; then
            reason="Supabase 토큰이 유효하지 않습니다(HTTP $code, 만료 가능)."
            warn=1
          fi

          days=""
          if printf '%s' "$TOKEN" | grep -q '\.'; then
            exp=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('exp',''))" 2>/dev/null)
            if [ -n "$exp" ]; then days=$(( (exp - $(date +%s)) / 86400 )); fi
          fi
          if [ -z "$days" ] && [ -n "$EXPIRES_AT" ]; then
            days=$(( ( $(date -d "$EXPIRES_AT" +%s) - $(date +%s) ) / 86400 ))
          fi

          if [ -n "$days" ]; then
            echo "토큰 만료까지 약 ${days}일"
            echo "days=$days" >> "$GITHUB_OUTPUT"
            if [ "$days" -le 14 ]; then
              warn=1
              reason="${reason} 토큰이 약 ${days}일 후 만료됩니다."
            fi
          else
            echo "만료일을 알 수 없습니다. 시크릿 SUPABASE_TOKEN_EXPIRES_AT(YYYY-MM-DD)을 설정하면 임박 알림이 동작합니다."
          fi

          if [ "$warn" = "1" ]; then
            echo "::warning::${reason} 새 토큰을 발급해 GitHub 시크릿 SUPABASE_ACCESS_TOKEN 을 갱신하세요."
            echo "alert=1" >> "$GITHUB_OUTPUT"
            echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          else
            echo "토큰 상태 양호"
            echo "alert=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue if needed
        if: steps.check.outputs.alert == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          title="[알림] Supabase Access Token 갱신 필요"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "이미 열린 이슈가 있어 생략합니다."
            exit 0
          fi
          body=$(printf 'Supabase 함수 배포용 토큰을 갱신해야 합니다.\n\n- 사유: %s\n- 조치: Supabase → Account → Access Tokens 에서 새 토큰 발급 → GitHub 리포 시크릿 SUPABASE_ACCESS_TOKEN 값 교체\n- (선택) 만료일을 시크릿 SUPABASE_TOKEN_EXPIRES_AT(YYYY-MM-DD)에 기록하면 임박 알림이 정확해집니다.\n\n참고: 이미 배포된 Edge Function은 토큰이 만료돼도 계속 동작하며, 만료 시 새 배포만 막힙니다.' "$REASON")
          gh issue create --title "$title" --body "$body"
