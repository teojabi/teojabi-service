name: Deploy Beta Data Service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'beta-service/**'
      - '.github/workflows/beta-service-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Package beta data service
        run: tar -czf beta-service-deploy.tgz -C beta-service .

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      # SSH 핸드셰이크가 간헐적으로 끊기는 문제(ssh: handshake failed: EOF)를 흡수하도록 업로드를 재시도한다.
      - name: Upload beta data service
        uses: nick-fields/retry@v3
        env:
          SSHPASS: ${{ secrets.NCP_SSH_PASSWORD }}
        with:
          timeout_minutes: 5
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            beta-service-deploy.tgz ${{ secrets.NCP_SSH_USER }}@${{ secrets.NCP_SSH_HOST }}:teojabi-runtime/beta-service/

      # 활성화 스크립트는 재실행에 안전하지 않으므로, 먼저 SSH 접속이 될 때까지 재시도해 연결 실패를 흡수한다.
      - name: Wait for SSH before activating beta data service
        uses: nick-fields/retry@v3
        env:
          SSHPASS: ${{ secrets.NCP_SSH_PASSWORD }}
        with:
          timeout_minutes: 2
          max_attempts: 8
          retry_wait_seconds: 15
          command: >-
            sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10
            ${{ secrets.NCP_SSH_USER }}@${{ secrets.NCP_SSH_HOST }} echo ssh-ready

      - name: Activate beta data service
        uses: appleboy/ssh-action@v1.1.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.NCP_SSH_HOST }}
          username: ${{ secrets.NCP_SSH_USER }}
          password: ${{ secrets.NCP_SSH_PASSWORD }}
          command_timeout: 10m
          envs: DATABASE_URL,GEMINI_API_KEY
          script: |
            set -e
            cd ~/teojabi-runtime/beta-service
            tar -xzf beta-service-deploy.tgz
            rm -f beta-service-deploy.tgz

            # 디스크 포화가 SSH/배포 실패로 이어지지 않도록 상태를 남기고 오래된 로그를 비운다.
            echo '--- DISK BEFORE ---'
            df -h .
            pm2 flush teojabi-data >/dev/null 2>&1 || true
            find "$HOME/.pm2/logs" -type f -name 'teojabi-data-*.log' -size +20M -exec truncate -s 0 {} \; 2>/dev/null || true

            if ! python3 -m venv --help >/dev/null 2>&1 || ! python3 -m ensurepip --version >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3.12-venv
            fi
            if [ ! -x .venv/bin/pip ]; then
              rm -rf .venv
              python3 -m venv .venv
            fi
            .venv/bin/pip install --disable-pip-version-check --no-cache-dir psycopg2-binary==2.9.10

            cat > .env << ENVEOF
            TEOJABI_SERVICE_MODE=production
            TEOJABI_DATA_SOURCE=supabase
            TEOJABI_DATABASE_URL=${DATABASE_URL}
            TEOJABI_PYTHON=$HOME/teojabi-runtime/beta-service/.venv/bin/python
            TEOJABI_ALLOWED_HOSTS=api.teojabi.com
            TEOJABI_WEB_ORIGINS=https://teojabi.com,https://www.teojabi.com
            DISCOVERY_API_BASE=https://api.teojabi.com
            GEMINI_API_KEY=${GEMINI_API_KEY}
            NAVER_MAP_CLIENT_ID=f8td9fq8kq
            PORT=4173
            ENVEOF
            chmod 600 .env

            set -a
            . ./.env
            set +a
            # Recreate the PM2 entry so its script path follows the migrated runtime directory.
            # A reload keeps the original script path and can silently run stale code.
            pm2 delete teojabi-data >/dev/null 2>&1 || true
            pm2 start "$HOME/teojabi-runtime/beta-service/serve.mjs" --name teojabi-data --cwd "$HOME/teojabi-runtime/beta-service"
            pm2 save

            sudo mkdir -p /etc/nginx/snippets
            sudo tee /etc/nginx/snippets/teojabi-beta.conf >/dev/null <<'NGINXEOF'
            location ^~ /beta/ {
                proxy_pass http://127.0.0.1:4173/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            NGINXEOF
            nginx_file=$(sudo grep -RIl 'server_name api.teojabi.com' /etc/nginx/sites-enabled /etc/nginx/conf.d | head -1)
            test -n "$nginx_file"
            if ! sudo grep -q 'teojabi-beta.conf' "$nginx_file"; then
              sudo sed -i '/server_name api\.teojabi\.com;/a\    include /etc/nginx/snippets/teojabi-beta.conf;' "$nginx_file"
            fi
            sudo nginx -t
            sudo systemctl reload nginx
            sleep 3
            curl --fail --silent --show-error -H 'Host: api.teojabi.com' 'http://127.0.0.1:4173/api/catalog?limit=1' >/dev/null
            pm2 describe teojabi-data
