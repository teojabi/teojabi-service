name: Curation Cleanup

# 등록 매물에서 터잡이픽(게시됨)만 남기고 자동 선별 코호트를 삭제한다.
# mode 파일(.github/curation-cleanup-mode.txt) 내용이 purge 이면 삭제, 그 외에는 조회만 한다.
# 삭제 후 고객 카탈로그(selected-catalog)와 관리자 등록 스냅샷(curation-registered)을 재생성한다.
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/curation-cleanup-mode.txt'
      - '.github/workflows/curation-cleanup.yml'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read mode
        id: mode
        run: echo "mode=$(tr -d '[:space:]' < .github/curation-cleanup-mode.txt)" >> "$GITHUB_OUTPUT"

      - name: Clean up curation candidates on NCP
        uses: appleboy/ssh-action@v1.1.0
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        with:
          host: ${{ secrets.NCP_SSH_HOST }}
          username: ${{ secrets.NCP_SSH_USER }}
          password: ${{ secrets.NCP_SSH_PASSWORD }}
          command_timeout: 10m
          envs: MODE
          script: |
            set -e
            cd ~/teojabi-runtime/beta-service
            set -a
            . ./.env
            set +a
            .venv/bin/python - <<'PY'
            import os, sys, json, traceback, subprocess
            import psycopg2
            from psycopg2.extras import RealDictCursor

            sys.path.insert(0, os.path.join(os.getcwd(), 'automation'))
            sys.stdout.reconfigure(encoding='utf-8')
            mode = (os.environ.get('MODE') or 'report').strip()
            print('MODE =', mode)

            TABLE = 'public.teojabi_curation_candidates'
            NOT_PICK = "COALESCE(snapshot->'teojabiPick'->>'status','') <> 'published'"

            def report(cur):
                cur.execute(f'SELECT count(*) AS n FROM {TABLE}')
                total = cur.fetchone()['n']
                cur.execute(f"SELECT count(*) AS n FROM {TABLE} WHERE {NOT_PICK}")
                removable = cur.fetchone()['n']
                cur.execute(f"SELECT count(*) AS n FROM {TABLE} WHERE snapshot->'teojabiPick'->>'status'='published'")
                published = cur.fetchone()['n']
                return {"total": total, "published_kept": published, "removable": removable}

            try:
                from service_database import service_config
                config = service_config()
                print('DB host =', config.get('host'))
                with psycopg2.connect(**config, connect_timeout=10, options='-c statement_timeout=60000') as conn:
                    with conn.cursor(cursor_factory=RealDictCursor) as cur:
                        cur.execute('SELECT pg_advisory_xact_lock(174209151)')
                        print('BEFORE', json.dumps(report(cur), ensure_ascii=False))
                        if mode != 'purge':
                            print('MODE != purge 이므로 삭제하지 않았습니다.')
                        else:
                            cur.execute(f'DELETE FROM {TABLE} WHERE {NOT_PICK}')
                            print('DELETED', cur.rowcount)
                            print('AFTER', json.dumps(report(cur), ensure_ascii=False))
            except Exception:
                print('DELETE_STEP_FAILED')
                traceback.print_exc()
                sys.exit(1)

            if mode == 'purge':
                # 고객 화면 스냅샷(selected-catalog)과 관리자 등록 스냅샷(curation-registered)을 모두 갱신한다.
                for script in ('automation/assign_service_numbers.py', 'automation/prepare_selected_preview.py'):
                    print('RUN', script)
                    done = subprocess.run([sys.executable, '-X', 'utf8', script], capture_output=True, text=True)
                    print(done.stdout.strip())
                    if done.returncode != 0:
                        print(done.stderr.strip()); print('SNAPSHOT_STEP_FAILED', script); sys.exit(1)
                print('RUN automation/curation.py list (admin registered snapshot)')
                done = subprocess.run([sys.executable, '-X', 'utf8', 'automation/curation.py', 'list'], capture_output=True, text=True)
                print(done.stdout.strip()[:400])
                if done.returncode != 0:
                    print(done.stderr.strip()); print('SNAPSHOT_STEP_FAILED curation.py list'); sys.exit(1)
                print('SNAPSHOTS regenerated')
            PY
