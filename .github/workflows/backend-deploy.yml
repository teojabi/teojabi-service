name: Deploy Backend to NCP

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build backend on GitHub runner
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx prisma generate
          npm run build

      # 서버에는 npm/컴파일러가 없어도 되도록, 러너(Linux)에서 운영 의존성만 설치해 통째로 배포한다.
      # dev 전용인 prisma CLI(@prisma/dev -> @prisma/streams-local)의 Node >=22 요구는 서버 런타임과
      # 무관하므로 --omit=dev로 배제한다. 런타임 @prisma/client는 Node ^20.19를 지원해 Node 20 서버에서 동작한다.
      - name: Prepare portable production node_modules
        working-directory: backend
        run: |
          # 빌드 단계에서 만든 Prisma 클라이언트는 WASM 기반이라 플랫폼 독립적이다. 잠시 보관했다가 복원한다.
          rm -rf /tmp/teojabi-prisma-client
          cp -R node_modules/.prisma /tmp/teojabi-prisma-client
          # 운영 의존성만 설치한다. (dev 전용 @prisma/dev -> @prisma/streams-local의 Node >=22 요구 배제)
          rm -rf node_modules
          npm ci --omit=dev --legacy-peer-deps --no-audit --no-fund
          mkdir -p node_modules/.prisma
          cp -R /tmp/teojabi-prisma-client/. node_modules/.prisma/
          rm -rf /tmp/teojabi-prisma-client
          test -f node_modules/.prisma/client/index.js
          test -d node_modules/@img/sharp-linux-x64
          node -e "require('sharp'); console.log('sharp ready for linux-x64')"

      - name: Package build output and runtime dependencies
        run: |
          mkdir -p deploy-package
          cp -R backend/dist deploy-package/dist
          cp -R backend/node_modules deploy-package/node_modules
          cp backend/package.json deploy-package/package.json
          cp backend/package-lock.json deploy-package/package-lock.json
          tar -czf backend-deploy.tgz -C deploy-package .

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      # SSH 핸드셰이크가 간헐적으로 끊기는 문제(ssh: handshake failed: EOF)를 흡수하도록 업로드를 재시도한다.
      - name: Upload runtime files to NCP
        uses: nick-fields/retry@v3
        env:
          SSHPASS: ${{ secrets.NCP_SSH_PASSWORD }}
        with:
          timeout_minutes: 15
          max_attempts: 4
          retry_wait_seconds: 15
          command: >-
            sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            backend-deploy.tgz ${{ secrets.NCP_SSH_USER }}@${{ secrets.NCP_SSH_HOST }}:teojabi-service/backend/

      # 활성화 스크립트는 재실행에 안전하지 않으므로, 먼저 SSH 접속이 될 때까지 재시도해 연결 실패를 흡수한다.
      - name: Wait for SSH before activating backend
        uses: nick-fields/retry@v3
        env:
          SSHPASS: ${{ secrets.NCP_SSH_PASSWORD }}
        with:
          timeout_minutes: 2
          max_attempts: 8
          retry_wait_seconds: 15
          command: >-
            sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10
            ${{ secrets.NCP_SSH_USER }}@${{ secrets.NCP_SSH_HOST }} echo ssh-ready

      - name: Activate backend on NCP
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.NCP_SSH_HOST }}
          username: ${{ secrets.NCP_SSH_USER }}
          password: ${{ secrets.NCP_SSH_PASSWORD }}
          command_timeout: 10m
          envs: DATABASE_URL,DIRECT_URL,PORT,FRONTEND_URL,JWT_SECRET,NCLOUD_MAIL_BASE_URL,NCLOUD_ACCESS_KEY,NCLOUD_SECRET_KEY,NCLOUD_MAIL_SENDER_ADDRESS,NCLOUD_MAIL_SENDER_NAME,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_BUCKET,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,NAVER_CALLBACK_URL,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_CALLBACK_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_CALLBACK_URL,GEMINI_API_KEY,NTS_SERVICE_KEY,PORTONE_STORE_ID,PORTONE_CHANNEL_KEY_SUBSCRIPTION,PORTONE_CHANNEL_KEY_ONETIME,PORTONE_API_SECRET,PORTONE_WEBHOOK_SECRET
          script: |
            set -e
            cd ~/teojabi-service/backend

            # 디스크 포화가 SSH/빌드 실패로 이어지지 않도록, 배포 전 상태를 남기고 이전 잔여물을 정리한다.
            echo '--- DISK BEFORE ---'
            df -h .
            rm -rf node_modules.old dist.old /tmp/teojabi-payload
            pm2 flush teojabi-backend >/dev/null 2>&1 || true
            find "$HOME/.pm2/logs" -type f -name 'teojabi-backend-*.log' -size +20M -exec truncate -s 0 {} \; 2>/dev/null || true

            # 배포 패키지를 먼저 안전한 곳에 풀어 둔다. (git clean이 지우지 못하도록)
            rm -rf /tmp/teojabi-payload
            mkdir -p /tmp/teojabi-payload
            tar -xzf backend-deploy.tgz -C /tmp/teojabi-payload
            rm -f backend-deploy.tgz

            cat > .env << ENVEOF
            NODE_ENV="production"
            TEOJABI_FRONTEND_MODE="beta"
            DATABASE_URL="${DATABASE_URL}"
            DIRECT_URL="${DIRECT_URL}"
            PORT="${PORT}"
            FRONTEND_URL="https://teojabi.com"
            FRONTEND_URLS="https://teojabi.com,https://www.teojabi.com,http://127.0.0.1:4173,http://localhost:4173"
            JWT_SECRET="${JWT_SECRET}"
            NCLOUD_MAIL_BASE_URL="${NCLOUD_MAIL_BASE_URL}"
            NCLOUD_ACCESS_KEY="${NCLOUD_ACCESS_KEY}"
            NCLOUD_SECRET_KEY="${NCLOUD_SECRET_KEY}"
            NCLOUD_MAIL_SENDER_ADDRESS="${NCLOUD_MAIL_SENDER_ADDRESS}"
            NCLOUD_MAIL_SENDER_NAME="${NCLOUD_MAIL_SENDER_NAME}"
            SUPABASE_URL="${SUPABASE_URL}"
            SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"
            SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}"
            SUPABASE_BUCKET="${SUPABASE_BUCKET}"
            NAVER_CLIENT_ID="${NAVER_CLIENT_ID}"
            NAVER_CLIENT_SECRET="${NAVER_CLIENT_SECRET}"
            NAVER_CALLBACK_URL="${NAVER_CALLBACK_URL}"
            KAKAO_CLIENT_ID="${KAKAO_CLIENT_ID}"
            KAKAO_CLIENT_SECRET="${KAKAO_CLIENT_SECRET}"
            KAKAO_CALLBACK_URL="${KAKAO_CALLBACK_URL}"
            GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"
            GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}"
            GOOGLE_CALLBACK_URL="${GOOGLE_CALLBACK_URL}"
            GEMINI_API_KEY="${GEMINI_API_KEY}"
            NTS_SERVICE_KEY="${NTS_SERVICE_KEY}"
            PORTONE_STORE_ID="${PORTONE_STORE_ID}"
            PORTONE_CHANNEL_KEY_SUBSCRIPTION="${PORTONE_CHANNEL_KEY_SUBSCRIPTION}"
            PORTONE_CHANNEL_KEY_ONETIME="${PORTONE_CHANNEL_KEY_ONETIME}"
            PORTONE_API_SECRET="${PORTONE_API_SECRET}"
            PORTONE_WEBHOOK_SECRET="${PORTONE_WEBHOOK_SECRET}"
            ENVEOF

            # 시크릿 누락을 배포 로그에서 즉시 확인한다. (값은 절대 출력하지 않고 설정 여부만 남긴다)
            for name in DATABASE_URL DIRECT_URL JWT_SECRET NTS_SERVICE_KEY GEMINI_API_KEY PORTONE_API_SECRET SUPABASE_SERVICE_ROLE_KEY; do
              eval "value=\${$name:-}"
              if [ -z "$value" ]; then echo "WARN missing secret: $name"; else echo "secret set: $name"; fi
            done

            # One-time cleanup for the first beta-service deployment, which placed
            # runtime files inside this checkout before the tracked directory existed.
            if [ -d "$HOME/teojabi-service/beta-service" ] && ! git ls-files --error-unmatch beta-service/serve.mjs >/dev/null 2>&1; then
              rm -rf "$HOME/teojabi-service/beta-service"
            fi
            # 서버 체크아웃을 origin/main과 강제로 맞춘다. (배포 패키지는 /tmp에 이미 풀어 두어 영향 없음)
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd -e .env -e '*.log'

            # 새 런타임을 별도 디렉터리에 미리 준비한다. (이 동안 기존 앱은 계속 서비스한다)
            rm -rf node_modules.new dist.new
            cp -R /tmp/teojabi-payload/node_modules node_modules.new
            cp -R /tmp/teojabi-payload/dist dist.new
            rm -rf /tmp/teojabi-payload

            echo '--- SERVER ENV ---'
            uname -m
            node --version

            # 교체 직전까지 앱을 살려 두고, 디렉터리 이름만 맞바꿔 다운타임을 최소화한다.
            # npm/런타임이 파일을 잡고 rename하는 상황(ENOTEMPTY)을 피하려면 교체 전에 반드시 멈춘다.
            had_pm2=0
            if pm2 describe teojabi-backend >/dev/null 2>&1; then
              had_pm2=1
              pm2 stop teojabi-backend || true
            fi

            rm -rf node_modules.old dist.old
            if [ -d node_modules ]; then mv node_modules node_modules.old; fi
            if [ -d dist ]; then mv dist dist.old; fi
            mv node_modules.new node_modules
            mv dist.new dist

            echo '--- SHARP LOAD ---'
            # 아키텍처가 러너와 달라 prebuilt가 맞지 않는 경우에만 해당 플랫폼 바이너리를 받는다.
            if ! node -e "require('sharp')" 2>/dev/null; then
              echo 'sharp load failed; installing platform binary for this server'
              npm install --omit=dev --no-save --legacy-peer-deps --no-audit --no-fund sharp@0.35.4
            fi
            node -e "require('sharp'); console.log('sharp ok')"

            echo '--- DEPLOYED main.ts marker ---'
            grep -o "Production requires[^']*" dist/src/main.js | head -1 || true

            # 이전 크래시 루프의 오래된 로그가 진단을 가리지 않도록 비운다.
            pm2 flush teojabi-backend >/dev/null 2>&1 || true

            if [ "$had_pm2" = "1" ]; then
              pm2 restart teojabi-backend --update-env
            else
              pm2 start dist/src/main.js --name teojabi-backend
            fi
            pm2 save
            sleep 5
            pm2 describe teojabi-backend

            # 서버 측 게이트는 PM2 프로세스 생존 여부다. (curl/wget 설치 여부에 의존하지 않는다)
            backend_port="${PORT:-3000}"
            backend_pid=""
            for attempt in $(seq 1 24); do
              backend_pid=$(pm2 pid teojabi-backend 2>/dev/null | head -1 | tr -d '[:space:]')
              if [ -n "$backend_pid" ] && [ "$backend_pid" != "0" ] && kill -0 "$backend_pid" 2>/dev/null; then
                echo "PM2 process online (pid ${backend_pid})"
                break
              fi
              backend_pid=""
              echo "PM2 process not running yet (attempt ${attempt}/24); retrying in 5s"
              sleep 5
            done
            # 참고용 로컬 응답 코드 (실패 판정에는 쓰지 않고, 공개 API 검증은 러너에서 한다)
            local_code=$(CHECK_PORT="$backend_port" node -e '
              const http = require("http");
              const port = process.env.CHECK_PORT || "3000";
              const req = http.get({ host: "127.0.0.1", port, path: "/api/v1/users/me", timeout: 4000 }, (res) => { console.log(res.statusCode); process.exit(0); });
              req.on("error", () => { console.log("000"); process.exit(0); });
              req.on("timeout", () => { req.destroy(); console.log("000"); process.exit(0); });
            ' 2>/dev/null || echo 000)
            echo "Local /api/v1/users/me responded ${local_code}"

            if [ -z "$backend_pid" ]; then
              # 새 버전이 뜨지 않으면 즉시 이전 버전으로 되돌려 서비스가 죽지 않게 한다.
              echo 'New version did not stay online; rolling back to the previous build'
              rm -rf node_modules dist
              if [ -d node_modules.old ]; then mv node_modules.old node_modules; fi
              if [ -d dist.old ]; then mv dist.old dist; fi
              if [ "$had_pm2" = "1" ]; then
                pm2 restart teojabi-backend --update-env || true
              else
                pm2 start dist/src/main.js --name teojabi-backend || true
              fi
              {
                echo "Backend process did not stay online after restarts (rolled back)"
                echo '--- NODE ---'
                node --version
                echo '--- ARCH ---'
                uname -m
                echo '--- SHARP LOAD ---'
                node -e "require('sharp'); console.log('sharp ok')" 2>&1 || true
                echo '--- PRISMA CLIENT ---'
                node -e "const {PrismaClient}=require('@prisma/client'); console.log('prisma client ok')" 2>&1 || true
                echo '--- DEPLOYED main.ts marker ---'
                grep -o "Production requires[^']*" dist/src/main.js | head -1 || true
                echo '--- PM2 ERROR LOG ---'
                tail -n 150 "$HOME/.pm2/logs/teojabi-backend-error.log" || true
                echo '--- PM2 OUT LOG ---'
                tail -n 80 "$HOME/.pm2/logs/teojabi-backend-out.log" || true
              } | tee "$HOME/teojabi-service/backend/deploy-diagnostics.txt"
              exit 1
            fi

            # 성공: 이전 버전 백업과 지난 진단 파일을 정리한다.
            rm -rf node_modules.old dist.old
            rm -f "$HOME/teojabi-service/backend/deploy-diagnostics.txt"

      - name: Verify public API
        run: |
          # nginx를 포함한 실제 공개 경로를 러너에서 확인한다. (/api/v1/users/me는 미인증 시 401)
          for attempt in $(seq 1 18); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' https://api.teojabi.com/api/v1/users/me || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              echo "Public API healthy (HTTP ${code})"
              exit 0
            fi
            echo "Public API not ready (attempt ${attempt}/18, status ${code:-no-response}); retrying in 5s"
            sleep 5
          done
          echo 'Public API health check failed'
          exit 1

      - name: Show deploy diagnostics
        if: failure()
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.NCP_SSH_HOST }}
          username: ${{ secrets.NCP_SSH_USER }}
          password: ${{ secrets.NCP_SSH_PASSWORD }}
          command_timeout: 2m
          script: |
            echo '===== deploy-diagnostics.txt ====='
            cat ~/teojabi-service/backend/deploy-diagnostics.txt 2>/dev/null || echo 'no diagnostics file found'
