name: Deploy Backend to NCP

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to NCP via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NCP_SSH_HOST }}
          username: ${{ secrets.NCP_SSH_USER }}
          password: ${{ secrets.NCP_SSH_PASSWORD }}
          envs: DATABASE_URL,DIRECT_URL,PORT,FRONTEND_URL,JWT_SECRET,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_BUCKET,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,NAVER_CALLBACK_URL,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_CALLBACK_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_CALLBACK_URL
          script: |
            echo "=== Step 1: 디렉토리 이동 ==="
            cd ~/teojabi-service/backend

            echo "=== Step 2: 운영서버용 .env 파일 생성 ==="
            # 운영서버용 .env 파일 생성
            cat > .env << ENVEOF
            DATABASE_URL="${DATABASE_URL}"
            DIRECT_URL="${DIRECT_URL}"
            PORT="${PORT}"
            FRONTEND_URL="${FRONTEND_URL}"
            JWT_SECRET="${JWT_SECRET}"
            SUPABASE_URL="${SUPABASE_URL}"
            SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"
            SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}"
            SUPABASE_BUCKET="${SUPABASE_BUCKET}"
            NAVER_CLIENT_ID="${NAVER_CLIENT_ID}"
            NAVER_CLIENT_SECRET="${NAVER_CLIENT_SECRET}"
            NAVER_CALLBACK_URL="${NAVER_CALLBACK_URL}"
            KAKAO_CLIENT_ID="${KAKAO_CLIENT_ID}"
            KAKAO_CLIENT_SECRET="${KAKAO_CLIENT_SECRET}"
            KAKAO_CALLBACK_URL="${KAKAO_CALLBACK_URL}"
            GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"
            GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}"
            GOOGLE_CALLBACK_URL="${GOOGLE_CALLBACK_URL}"
            ENVEOF
            echo "=== .env 생성 완료"
            cat .env | head -3

            echo "=== Step 3:  git pull origin main"
            git pull origin main
            echo "=== Step 4:  npm install"
            npm install
            echo "=== Step 5:  npx prisma generate"
            npx prisma generate
            echo "=== Step 6:  npm run build"
            npm run build
            echo "=== Step 7:  pm2 delete teojabi-backend (if exists)"
            pm2 delete teojabi-backend || true
            echo "=== Step 8:  pm2 start dist/src/main.js --name teojabi-backend"
            pm2 start dist/src/main.js --name teojabi-backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PORT: ${{ secrets.PORT }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_CALLBACK_URL: ${{ secrets.NAVER_CALLBACK_URL }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_CALLBACK_URL: ${{ secrets.KAKAO_CALLBACK_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
