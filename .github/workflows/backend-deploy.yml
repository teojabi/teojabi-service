name: Deploy Backend to NCP

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build backend on GitHub runner
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx prisma generate
          npm run build

      - name: Package build output and manifests
        run: |
          mkdir -p deploy-package
          cp -R backend/dist deploy-package/dist
          cp backend/package.json deploy-package/package.json
          cp backend/package-lock.json deploy-package/package-lock.json
          tar -czf backend-deploy.tgz -C deploy-package .

      - name: Upload runtime files to NCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NCP_SSH_HOST }}
          username: ${{ secrets.NCP_SSH_USER }}
          password: ${{ secrets.NCP_SSH_PASSWORD }}
          source: backend-deploy.tgz
          target: ~/teojabi-service/backend
          timeout: 2m
          command_timeout: 5m

      - name: Activate backend on NCP
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.NCP_SSH_HOST }}
          username: ${{ secrets.NCP_SSH_USER }}
          password: ${{ secrets.NCP_SSH_PASSWORD }}
          command_timeout: 10m
          envs: DATABASE_URL,DIRECT_URL,PORT,FRONTEND_URL,JWT_SECRET,NCLOUD_MAIL_BASE_URL,NCLOUD_ACCESS_KEY,NCLOUD_SECRET_KEY,NCLOUD_MAIL_SENDER_ADDRESS,NCLOUD_MAIL_SENDER_NAME,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_BUCKET,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,NAVER_CALLBACK_URL,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_CALLBACK_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_CALLBACK_URL,GEMINI_API_KEY,NTS_SERVICE_KEY,PORTONE_STORE_ID,PORTONE_CHANNEL_KEY_SUBSCRIPTION,PORTONE_CHANNEL_KEY_ONETIME,PORTONE_API_SECRET,PORTONE_WEBHOOK_SECRET
          script: |
            set -e
            cd ~/teojabi-service/backend

            cat > .env << ENVEOF
            NODE_ENV="production"
            TEOJABI_FRONTEND_MODE="beta"
            DATABASE_URL="${DATABASE_URL}"
            DIRECT_URL="${DIRECT_URL}"
            PORT="${PORT}"
            FRONTEND_URL="https://teojabi.com"
            FRONTEND_URLS="https://teojabi.com,https://www.teojabi.com,http://127.0.0.1:4173,http://localhost:4173"
            JWT_SECRET="${JWT_SECRET}"
            NCLOUD_MAIL_BASE_URL="${NCLOUD_MAIL_BASE_URL}"
            NCLOUD_ACCESS_KEY="${NCLOUD_ACCESS_KEY}"
            NCLOUD_SECRET_KEY="${NCLOUD_SECRET_KEY}"
            NCLOUD_MAIL_SENDER_ADDRESS="${NCLOUD_MAIL_SENDER_ADDRESS}"
            NCLOUD_MAIL_SENDER_NAME="${NCLOUD_MAIL_SENDER_NAME}"
            SUPABASE_URL="${SUPABASE_URL}"
            SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"
            SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}"
            SUPABASE_BUCKET="${SUPABASE_BUCKET}"
            NAVER_CLIENT_ID="${NAVER_CLIENT_ID}"
            NAVER_CLIENT_SECRET="${NAVER_CLIENT_SECRET}"
            NAVER_CALLBACK_URL="${NAVER_CALLBACK_URL}"
            KAKAO_CLIENT_ID="${KAKAO_CLIENT_ID}"
            KAKAO_CLIENT_SECRET="${KAKAO_CLIENT_SECRET}"
            KAKAO_CALLBACK_URL="${KAKAO_CALLBACK_URL}"
            GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"
            GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}"
            GOOGLE_CALLBACK_URL="${GOOGLE_CALLBACK_URL}"
            GEMINI_API_KEY="${GEMINI_API_KEY}"
            NTS_SERVICE_KEY="${NTS_SERVICE_KEY}"
            PORTONE_STORE_ID="${PORTONE_STORE_ID}"
            PORTONE_CHANNEL_KEY_SUBSCRIPTION="${PORTONE_CHANNEL_KEY_SUBSCRIPTION}"
            PORTONE_CHANNEL_KEY_ONETIME="${PORTONE_CHANNEL_KEY_ONETIME}"
            PORTONE_API_SECRET="${PORTONE_API_SECRET}"
            PORTONE_WEBHOOK_SECRET="${PORTONE_WEBHOOK_SECRET}"
            ENVEOF

            # One-time cleanup for the first beta-service deployment, which placed
            # runtime files inside this checkout before the tracked directory existed.
            if [ -d "$HOME/teojabi-service/beta-service" ] && ! git ls-files --error-unmatch beta-service/serve.mjs >/dev/null 2>&1; then
              rm -rf "$HOME/teojabi-service/beta-service"
            fi
            # 서버 체크아웃이 과거 시점에 멈춰 있을 수 있어, 로컬 변경을 버리고 origin/main과 강제로 맞춘다.
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd -e .env -e '*.log'
            tar -xzf backend-deploy.tgz
            rm -f backend-deploy.tgz

            # sharp 등 네이티브 모듈과 prisma CLI는 서버(Linux)에서 직접 설치한다.
            if [ ! -d node_modules ] || [ package-lock.json -nt node_modules/.package-lock.json ]; then
              npm ci --legacy-peer-deps --no-audit --no-fund
            fi
            npx prisma generate

            if pm2 describe teojabi-backend >/dev/null 2>&1; then
              pm2 reload teojabi-backend --update-env
            else
              pm2 start dist/src/main.js --name teojabi-backend
            fi
            pm2 save
            sleep 5
            pm2 describe teojabi-backend
            backend_port="${PORT:-3000}"
            status_code="000"
            # Prisma 연결과 표 생성으로 부팅이 몇 초 더 걸릴 수 있어 2분까지 재시도한다.
            for attempt in $(seq 1 24); do
              status_code=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${backend_port}/api/v1/users/me" || true)
              if [ "$status_code" = "401" ]; then break; fi
              echo "Backend not ready yet (attempt ${attempt}/24, status ${status_code:-no-response}); retrying in 5s"
              sleep 5
            done
            if [ "$status_code" != "401" ]; then
              echo "Backend health check failed after retries: expected 401, received ${status_code:-no-response}"
              pm2 logs teojabi-backend --lines 120 --nostream
              exit 1
            fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PORT: ${{ secrets.PORT }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NCLOUD_MAIL_BASE_URL: ${{ secrets.NCLOUD_MAIL_BASE_URL }}
          NCLOUD_ACCESS_KEY: ${{ secrets.NCLOUD_ACCESS_KEY }}
          NCLOUD_SECRET_KEY: ${{ secrets.NCLOUD_SECRET_KEY }}
          NCLOUD_MAIL_SENDER_ADDRESS: ${{ secrets.NCLOUD_MAIL_SENDER_ADDRESS }}
          NCLOUD_MAIL_SENDER_NAME: ${{ secrets.NCLOUD_MAIL_SENDER_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_CALLBACK_URL: ${{ secrets.NAVER_CALLBACK_URL }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_CALLBACK_URL: ${{ secrets.KAKAO_CALLBACK_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTS_SERVICE_KEY: ${{ secrets.NTS_SERVICE_KEY }}
          PORTONE_STORE_ID: ${{ secrets.PORTONE_STORE_ID }}
          PORTONE_CHANNEL_KEY_SUBSCRIPTION: ${{ secrets.PORTONE_CHANNEL_KEY_SUBSCRIPTION }}
          PORTONE_CHANNEL_KEY_ONETIME: ${{ secrets.PORTONE_CHANNEL_KEY_ONETIME }}
          PORTONE_API_SECRET: ${{ secrets.PORTONE_API_SECRET }}
          PORTONE_WEBHOOK_SECRET: ${{ secrets.PORTONE_WEBHOOK_SECRET }}
