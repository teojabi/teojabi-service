# manual-trigger: 2026-09-24T12:30Z
name: Deploy Supabase Functions

# Supabase Edge Functions(경매/데이터 API)을 배포한다.
# 사전 준비: 리포지토리 시크릿에 SUPABASE_ACCESS_TOKEN 을 추가한다.
# 토큰이 없으면 실패하지 않고 경고 후 건너뛴다.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions-deploy.yml'
      - 'beta-service/.local/supabase/selected-*.json'
      - 'beta-service/.local/inventory-summary.json'
      - 'beta-service/.local/disco-daily/activity.json'
      - 'beta-service/.local/curation-hidden.json'
      - 'beta-service/neighborhoods.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'tvrfrgozfoiucoeojrta' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN 시크릿이 없어 배포를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.token.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate snapshots module for data function
        if: steps.token.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          def load(path):
              try:
                  with open(path, encoding='utf-8') as handle:
                      return json.load(handle)
              except FileNotFoundError:
                  return None
          files = {
              'selectedCatalog': 'beta-service/.local/supabase/selected-catalog.json',
              'selectedZoning': 'beta-service/.local/supabase/selected-zoning.json',
              'selectedDevelopment': 'beta-service/.local/supabase/selected-development.json',
              'curationHidden': 'beta-service/.local/curation-hidden.json',
              'neighborhoods': 'beta-service/neighborhoods.json',
              'inventorySummary': 'beta-service/.local/inventory-summary.json',
              'discoActivity': 'beta-service/.local/disco-daily/activity.json',
          }
          data = {key: load(path) for key, path in files.items()}
          with open('supabase/functions/data/snapshots.ts', 'w', encoding='utf-8') as handle:
              handle.write('// generated at deploy time\nexport const snapshots: any = ' + json.dumps(data, ensure_ascii=False) + ';\n')
          print('snapshots.ts bytes', os.path.getsize('supabase/functions/data/snapshots.ts'))
          PY

      - name: Deploy functions
        id: deploy
        if: steps.token.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set +e
          {
            echo "=== deploy auction ==="
            npx --yes supabase@latest functions deploy auction --project-ref "$PROJECT_REF" --no-verify-jwt 2>&1
            echo "auction_exit=$?"
            echo "=== deploy data ==="
            npx --yes supabase@latest functions deploy data --project-ref "$PROJECT_REF" --no-verify-jwt 2>&1
            echo "data_exit=$?"
          } 2>&1 | tee deploy.log
          if grep -qE '_exit=[1-9]' deploy.log; then
            echo "::error::function deploy failed (see server-report/.diagnostics/function-deploy.log)"
            exit 1
          fi

      - name: Publish deploy log
        if: always() && steps.token.outputs.ready == 'true'
        run: |
          mkdir -p .diagnostics
          cp deploy.log .diagnostics/function-deploy.log 2>/dev/null || echo 'no deploy.log' > .diagnostics/function-deploy.log
          git config user.name "teojabi-diagnostics"
          git config user.email "teojabi-diagnostics@users.noreply.github.com"
          git checkout -B server-report
          git add -f .diagnostics/function-deploy.log
          git commit -m "Update function deploy log" || echo "no changes"
          git push -f origin server-report

      - name: Fail if deploy failed
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "function deploy failed; see server-report/.diagnostics/function-deploy.log"
          exit 1
