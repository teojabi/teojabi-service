name: Deploy Supabase Functions

# Supabase Edge Function(경매 API 파일럿)을 배포한다.
# 사전 준비: 리포지토리 시크릿에 SUPABASE_ACCESS_TOKEN 을 추가한다.
#   (Supabase Dashboard → Account → Access Tokens 에서 발급)
# 토큰이 없으면 실패하지 않고 경고 후 건너뛴다.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-functions-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'tvrfrgozfoiucoeojrta' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN 시크릿이 없어 배포를 건너뜁니다. Supabase Access Token을 리포지토리 시크릿에 추가하세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Supabase CLI
        if: steps.token.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy auction function
        if: steps.token.outputs.ready == 'true'
        run: |
          set -e
          supabase functions deploy auction \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt
          echo "deployed: https://${PROJECT_REF}.supabase.co/functions/v1/auction"
